name: ab_fitness_family
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

# ✅ SDK constraint
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & ICONS
  cupertino_icons: ^1.0.6

  # 🔔 NOTIFICATIONS & SONS
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.2.4

  # 📊 GESTION D'ÉTAT
  provider: ^6.0.5

  # ✅ PERMISSIONS
  permission_handler: ^11.3.1

  # 🔢 BADGE SUR L'ICÔNE DE L'APPLICATION
  # ⭐ CORRIGÉ : retour à flutter_app_badger (compatible Dart 3.6.2)
  flutter_app_badger: ^1.5.0

  # ✅ PHOTO DE PROFIL
  image_picker: ^1.0.7

  # ✅ FIREBASE
  firebase_core: ^2.31.1
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4
  google_sign_in: ^6.2.1

  # 🚀 SUPABASE
  supabase_flutter: ^2.0.0

  # 📁 SÉLECTION DE FICHIERS
  file_picker: ^8.0.0+1

  # ✅ OUVERTURE DE FICHIERS
  open_filex: ^4.7.0

  # ✅ PARTAGE DE FICHIERS
  share_plus: ^10.0.0

  # ✅ PERSISTANCE DES DONNÉES
  shared_preferences: ^2.5.3

  # ✅ AFFICHAGE PDF SUR WEB
  webview_flutter: ^4.4.2

  # ✅ VISIONNEUSE PDF
  syncfusion_flutter_pdfviewer: ^26.1.41

  # ✅ CHEMINS DE FICHIERS
  path_provider: ^2.1.0
  path: ^1.9.0

  # ✅ TÉLÉCHARGEMENT
  flutter_downloader: ^1.10.1

  # ⭐⭐⭐ Téléchargement HTTP
  dio: ^5.4.0

  # ✅ VISIONNEUSE PDF (ALTERNATIVE)
  pdfx: ^2.0.0

  # ✅ CRÉATION DE PDF
  pdf: ^3.10.4
  printing: ^5.11.0

  # ✅ FORMATAGE DES DATES
  intl: ^0.19.0

  # 🖼️ AFFICHAGE DES IMAGES EN CACHE
  cached_network_image: ^3.3.1

  # 🎬 LECTEUR VIDÉO
  video_player: ^2.8.3

  # 📦 POUR EXTRAIRE LES MÉTADONNÉES DES VIDÉOS
  video_thumbnail: ^0.5.3

  # 🎬 COMPRESSION VIDÉO
  video_compress: ^3.1.3

  # 🔗 OUVERTURE DE LIENS
  url_launcher: ^6.3.0

  # ✅ UPLOAD ET GESTION DES FICHIERS
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/aa.png"
  min_sdk_android: 21